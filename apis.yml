aid: eleanor-health
name: Eleanor Health
description: >-
  Eleanor Health is a value-based, whole-person addiction and mental health care
  provider delivering virtual and in-person treatment for substance use disorders
  — including opioid, alcohol, stimulant, and prescription drug use — through
  medication for addiction treatment (MAT), therapy, peer recovery support, and
  health coaching. Founded in 2019 and headquartered in Waltham, Massachusetts,
  the company partners with health plans and Medicaid programs across multiple
  U.S. states to deliver measurement-based, outcomes-driven behavioral healthcare.
  Eleanor Health is backed by General Catalyst. It does not publish a public
  developer API program; member scheduling and clinical records run on
  athenahealth, and its public GitHub organization holds internal engineering
  tooling rather than a first-party API.
